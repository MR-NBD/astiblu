            <h2 class="med-text">Dell'associazione dilettantistica ASTI BLU</h2>
            <p class="small-text">Il Consiglio Direttivo dell’Associazione Sportiva Dilettantistica “ASTI BLU” è organo
                dell’Associazione (art. 5 dello Statuto) e viene eletto ogni tre anni dall’Assemblea dei Soci.

                E’ composto da sei membri.Il Consiglio Direttivo è composto da:</p>
            <ul class="small-text">
                <li><b>Presidente:</b> dirige l’Associazione e ne è il legale rappresentante, convoca annualmente
                    l’assemblea; cura l’esecuzione dei deliberati dell ‘Assemblea e del Consiglio Direttivo.</li>
                <li><b>Vice Presidente:</b> coadiuva il Presidente nelle sue funzioni e ne fa le veci in sua assenza.
                </li>
                <li><b>Segretario:</b> adempie alle normali funzioni di segreteria; redige i verbali di consiglio che
                    verranno poi firmati dal Presidente e letti all ‘inizio del Consiglio successivo; collabora con i
                    diversi membri del Consiglio Direttivo nell ‘espletamento dei loro compiti.</li>
                <li><b>Tesoriere:</b> si occupa dell ‘amministrazione e della contabilità della Società , il suo operato
                    è sottoposto all ‘approvazione del Consiglio Direttivo.</li>
                <li><b>Direttore Sportivo:</b> programma ed organizza gli aspetti tecnici e la preparazione fisica degli
                    associati, seleziona la squadra agonistica.</li>
                <li><b>irettore dei Corsi:</b> provvede all ‘organizzazione dei corsi curandone tutti i particolari e il
                    regolare andamento.</li>
            </ul>
            <p class="small-text">Funzioni del Consiglio Direttvo. Delibera a maggioranza assoluta su tutti gli
                argomenti
                all ‘ordine del
                giorno e necessari al raggiungimento dei fini sociali ed in particolare:</p>

            <ul class="small-text">
                <li>Convoca le Assemblee, precisandone l ‘ordine del giorno;</li>
                <li>Fissa l ‘ammontare della quota associativa annuale e delle eventuali quote integrative sociali;</li>
                <li>Adotta provvedimenti disciplinari ed amministrativi nei confronti dei soci;</li>
                <li>Predispone il bilancio sia preventivo che consuntivo accompagnato dal resoconto delle attività
                    sociali svolte e dalla situazione finanziaria da approvare in Assemblea;</li>
                <li>Programma l ‘attività sociale.</li>
            </ul>
