backend:
  name: git-gateway
  branch: main

locale: it

media_folder: www.astiblu.it/img/uploads
public_folder: /img/uploads

collections:
  - name: contatti
    label: "📞 Contatti e InfoPoint"
    files:
      - name: contatti
        label: "Numeri di telefono e InfoPoint"
        file: www.astiblu.it/content/contatti.json
        fields:
          - name: email
            label: "Email principale"
            widget: string
          - name: istruttori
            label: "Istruttori (tabella telefoni)"
            widget: list
            summary: "{{fields.nome}} — {{fields.ruolo}}"
            fields:
              - {name: nome,     label: "Nome completo",    widget: string}
              - {name: ruolo,    label: "Riferimento per",  widget: string}
              - {name: telefono, label: "Telefono (solo cifre, es. 3395065299)", widget: string}
          - name: infopoint
            label: "InfoPoint (punti fisici)"
            widget: list
            summary: "{{fields.nome}} — {{fields.presso}}"
            fields:
              - {name: nome,     label: "Nome riferimento", widget: string}
              - {name: presso,   label: "Presso (negozio)", widget: string}
              - {name: indirizzo, label: "Indirizzo completo", widget: string}

  - name: homepage
    label: "🏠 Testi Sito"
    files:
      - name: homepage
        label: "Testi Homepage e pagine"
        file: www.astiblu.it/content/homepage.json
        fields:
          - {name: chi_siamo_1,      label: "Chi Siamo — paragrafo 1",        widget: text}
          - {name: chi_siamo_2,      label: "Chi Siamo — paragrafo 2",        widget: text}
          - {name: corsi_intro,      label: "Sezione Corsi — intro",          widget: text}
          - {name: corsi_stagione,   label: "Corsi — periodo e sede",         widget: string}
          - {name: allenamenti_testo, label: "Card Allenamenti — testo",      widget: text}
          - {name: viaggi_1,         label: "Gite Sociali — paragrafo 1",    widget: text}
          - {name: viaggi_2,         label: "Gite Sociali — paragrafo 2",    widget: text}
          - {name: dove_trovarci,    label: "Dove Trovarci — testo",         widget: text}
