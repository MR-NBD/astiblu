backend:
  name: github
  repo: MR-NBD/astiblu
  branch: main
  base_url: https://www.astiblu.it
  auth_endpoint: admin/oauth.php

locale: it

media_folder: www.astiblu.it/index/img
public_folder: /index/img

collections:
  - name: contatti
    label: "📞 Contatti e InfoPoint"
    files:
      - name: contatti
        label: "Numeri di telefono e InfoPoint"
        file: www.astiblu.it/content/contatti.json
        fields:
          - name: email
            label: "Email principale"
            widget: string
          - name: istruttori
            label: "Istruttori (tabella telefoni)"
            widget: list
            summary: "{{fields.nome}} - {{fields.ruolo}}"
            fields:
              - {name: nome,      label: "Nome completo",    widget: string}
              - {name: ruolo,     label: "Riferimento per",  widget: string}
              - {name: telefono,  label: "Telefono (solo cifre, es. 3395065299)", widget: string}
          - name: infopoint
            label: "InfoPoint (punti fisici)"
            widget: list
            summary: "{{fields.nome}} - {{fields.presso}}"
            fields:
              - {name: nome,      label: "Nome riferimento", widget: string}
              - {name: presso,    label: "Presso (negozio)", widget: string}
              - {name: indirizzo, label: "Indirizzo completo", widget: string}

  - name: homepage
    label: "🏠 Testi Sito"
    files:
      - name: homepage
        label: "Testi Homepage"
        file: www.astiblu.it/content/homepage.json
        fields:
          - {name: chi_siamo_1,       label: "Chi Siamo - paragrafo 1",     widget: text}
          - {name: chi_siamo_2,       label: "Chi Siamo - paragrafo 2",     widget: text}
          - {name: corsi_intro,       label: "Sezione Corsi - intro",       widget: text}
          - {name: corsi_stagione,    label: "Corsi - periodo e sede",      widget: string}
          - {name: allenamenti_testo, label: "Card Allenamenti - testo",    widget: text}
          - {name: viaggi_1,          label: "Gite Sociali - paragrafo 1",  widget: text}
          - {name: viaggi_2,          label: "Gite Sociali - paragrafo 2",  widget: text}
          - {name: dove_trovarci,     label: "Dove Trovarci - testo",       widget: text}

  - name: media
    label: "🖼️ Immagini e File"
    files:
      - name: immagini_carousel
        label: "Foto Carousel Corsi"
        file: www.astiblu.it/content/media.json
        fields:
          - name: apnea_card
            label: "Foto Apnea"
            widget: image
            hint: "Dimensione consigliata: 800×600px"
          - name: sub_card
            label: "Foto Subacquea"
            widget: image
            hint: "Dimensione consigliata: 800×600px"
          - name: agonismo_card
            label: "Foto Agonismo"
            widget: image
            hint: "Dimensione consigliata: 800×600px"
          - name: spec_card
            label: "Foto Specialità"
            widget: image
            hint: "Dimensione consigliata: 800×600px"
          - name: minisub_card
            label: "Foto MiniSub"
            widget: image
            hint: "Dimensione consigliata: 800×600px"
          - name: allenamenti_card
            label: "Foto Allenamenti"
            widget: image
            hint: "Dimensione consigliata: 800×600px"
          - name: cover_chi_siamo
            label: "Foto sezione Chi Siamo"
            widget: image
            media_folder: /www.astiblu.it/index/img
            public_folder: /index/img
            hint: "Foto principale della sezione Chi Siamo"
          - name: email_poster
            label: "Foto sezione contatto email"
            widget: image
            media_folder: /www.astiblu.it/index/img
            public_folder: /index/img

      - name: modulo_pdf
        label: "📄 Modulo Iscrizione PDF"
        file: www.astiblu.it/content/modulo.json
        fields:
          - name: pdf
            label: "File PDF Modulo Iscrizione"
            widget: file
            media_folder: /www.astiblu.it
            public_folder: /
            default: /modulo-iscrizione.pdf
            hint: "Carica il PDF aggiornato. Verrà scaricato dagli utenti dal bottone principale."
          - name: anno
            label: "Anno scolastico (es. 2026/2027)"
            widget: string
